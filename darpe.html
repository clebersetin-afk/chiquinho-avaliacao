<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DARPE — Escalas de Visitação</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
<style>
:root{
  --bg:#f0f4f8;--sur:#fff;--sur2:#f1f5f9;--sur3:#e8eef4;
  --brd:#dee5ed;--brd2:#c9d4df;
  --tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
  --blue:#1d4ed8;--blue-b:#dbeafe;
  --green:#166534;--green-b:#dcfce7;
  --purple:#6b21a8;--purple-b:#f3e8ff;
  --amber:#92400e;--amber-b:#fef3c7;
  --red:#991b1b;--red-b:#fee2e2;
  --cyan:#0369a1;--cyan-b:#e0f2fe;
  --ok:#166534;--ok-b:#dcfce7;--ok-br:#86efac;
  --err:#991b1b;--err-b:#fee2e2;--err-br:#fca5a5;
  --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 4px 12px rgba(0,0,0,.1);
  --r:8px;--rl:12px;--rxl:16px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d1524;--sur:#1a2438;--sur2:#243047;--sur3:#2d3a50;
  --brd:#2d3a50;--brd2:#3d4f68;
  --tx:#e8f0fa;--tx2:#94a3b8;--tx3:#64748b;
  --blue:#60a5fa;--blue-b:#1a2e5a;
  --green:#4ade80;--green-b:#042010;
  --purple:#c084fc;--purple-b:#2d0a5a;
  --amber:#fbbf24;--amber-b:#3a1a00;
  --red:#f87171;--red-b:#3a0a0a;
  --cyan:#38bdf8;--cyan-b:#072040;
  --ok:#4ade80;--ok-b:#042010;--ok-br:#166534;
  --err:#f87171;--err-b:#3a0a0a;--err-br:#991b1b;
  --sh:0 1px 3px rgba(0,0,0,.3);--sh2:0 4px 12px rgba(0,0,0,.4);
}}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px}
button{font-family:inherit;cursor:pointer;transition:all .15s}
input,textarea,select{font-family:inherit;font-size:12px;background:var(--sur);color:var(--tx);border:1px solid var(--brd);border-radius:var(--r);padding:5px 8px;outline:none;transition:border .15s}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,78,216,.12)}
textarea{resize:vertical;min-height:34px}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:3px}

/* ── HEADER ── */
#hdr{background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.h-brand{display:flex;align-items:center;gap:10px}
.h-logo{font-size:24px}
.h-title{font-size:15px;font-weight:700;color:#fff;letter-spacing:.2px}
.h-sub{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
/* NAV COLORIDO */
.h-nav{display:flex;gap:3px}
.nb{padding:6px 14px;border-radius:8px;border:none;font-size:12px;font-weight:600;color:rgba(255,255,255,.5);background:transparent;transition:all .15s;display:flex;align-items:center;gap:5px}
.nb:hover{background:rgba(255,255,255,.1);color:#fff}
.nb.on{color:#fff;font-weight:700}
.nb-e.on{background:#1d4ed8}
.nb-c.on{background:#166534}
.nb-r.on{background:#7c3aed}
/* MÊS NAVIGATION */
.month-nav{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.1);border-radius:8px;padding:3px}
.mnn{width:28px;height:28px;border-radius:6px;border:none;background:transparent;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
.mnn:hover{background:rgba(255,255,255,.15)}
.mn-label{font-size:13px;font-weight:600;color:#fff;min-width:130px;text-align:center}
/* ACTION BTNS */
.h-acts{display:flex;gap:5px;align-items:center}
.ab{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;border:none;font-size:12px;font-weight:600}
.ab-mail{background:rgba(3,105,161,.8);color:#fff}
.ab-mail:hover{background:#0369a1}
.ab-pdf{background:rgba(109,40,217,.8);color:#fff}
.ab-pdf:hover{background:#7c3aed}
.ab-save{background:rgba(22,101,52,.8);color:#fff}
.ab-save:hover{background:#166534}

/* ── TOAST ── */
#toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);padding:9px 22px;border-radius:30px;font-size:12px;font-weight:700;z-index:9999;display:none;white-space:nowrap;box-shadow:var(--sh2);pointer-events:none}
#toast.show{display:block;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#toast.ok{background:var(--ok-b);color:var(--ok);border:1px solid var(--ok-br)}
#toast.info{background:var(--cyan-b);color:var(--cyan);border:1px solid var(--brd)}
#toast.err{background:var(--err-b);color:var(--err);border:1px solid var(--err-br)}
#toast.warn{background:var(--amber-b);color:var(--amber);border:1px solid #fde68a}

/* ── WRAP ── */
#wrap{max-width:1060px;margin:0 auto;padding:14px 16px 3rem}

/* ── KPIs ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--sur);border-radius:var(--rl);padding:.75rem 1rem;border:1px solid var(--brd);box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi-r::before{background:#1d4ed8}.kpi-p::before{background:#166534}.kpi-a::before{background:#92400e}.kpi-i::before{background:#6b21a8}
.kpi-l{font-size:11px;color:var(--tx2);margin-bottom:4px;display:flex;align-items:center;gap:4px;font-weight:500}
.kpi-n{font-size:26px;font-weight:700;line-height:1;color:var(--tx)}
.kpi-s{font-size:10px;color:var(--tx3);margin-top:3px}

/* ── SETOR PILLS COLORIDOS ── */
.sstrip{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.spill{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:20px;border:2px solid transparent;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.spill-all{background:var(--sur);border-color:var(--brd2);color:var(--tx2)}
.spill-all:hover,.spill-all.on{background:#0f172a;border-color:#0f172a;color:#fff}
.spill-1{background:var(--blue-b);border-color:var(--blue-b);color:var(--blue)}
.spill-1:hover,.spill-1.on{background:var(--blue);border-color:var(--blue);color:#fff}
.spill-2{background:var(--green-b);border-color:var(--green-b);color:var(--green)}
.spill-2:hover,.spill-2.on{background:var(--green);border-color:var(--green);color:#fff}
.spill-3{background:var(--purple-b);border-color:var(--purple-b);color:var(--purple)}
.spill-3:hover,.spill-3.on{background:var(--purple);border-color:var(--purple);color:#fff}
.spill-4{background:var(--amber-b);border-color:var(--amber-b);color:var(--amber)}
.spill-4:hover,.spill-4.on{background:var(--amber);border-color:var(--amber);color:#fff}

/* ── INST CARDS ── */
.ilist{display:flex;flex-direction:column;gap:6px}
.ic{background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh);border-left-width:4px}
.ic-s1{border-left-color:#1d4ed8}
.ic-s2{border-left-color:#166534}
.ic-s3{border-left-color:#6b21a8}
.ic-s4{border-left-color:#92400e}
.ic-hd{width:100%;display:flex;align-items:center;gap:10px;padding:.625rem 1rem;cursor:pointer;background:none;border:none;text-align:left;color:var(--tx)}
.ic-hd:hover{background:var(--sur2)}
.ic-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ic-info{flex:1;min-width:0}
/* NOME DA INSTITUIÇÃO BEM DESTACADO */
.ic-name{font-size:14px;font-weight:800;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.ic-name-s1{color:#1d4ed8}
.ic-name-s2{color:#166534}
.ic-name-s3{color:#6b21a8}
.ic-name-s4{color:#92400e}
.ic-sub{font-size:10px;color:var(--tx3);margin-top:2px}
.ic-meta{display:flex;gap:12px;flex-shrink:0;text-align:center}
.ic-meta .mn{font-size:16px;font-weight:700;line-height:1}
.ic-meta .ml{font-size:9px;color:var(--tx3)}
.chev{font-size:15px;color:var(--tx3);flex-shrink:0;transition:transform .2s;margin-left:2px}
.chev.open{transform:rotate(90deg)}
.ic-body{border-top:1px solid var(--brd);padding:.625rem 1rem;display:none}
.ic-body.open{display:block}

/* ── COLABS ROW ── */
.crow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:.25rem 0 .5rem;border-bottom:1px solid var(--brd);margin-bottom:.5rem}
.ctags{display:flex;flex-wrap:wrap;gap:3px;flex:1}
.ct{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}
.btn-xs{padding:4px 10px;font-size:11px;border-radius:6px;border:1px solid var(--brd);background:none;color:var(--tx2);display:inline-flex;align-items:center;gap:3px;font-weight:500}
.btn-xs:hover{background:var(--sur2)}

/* ── VISIT ROWS ── */
.vlist{display:flex;flex-direction:column;gap:4px}
.vrow{border:1px solid var(--brd);border-radius:var(--r);overflow:hidden;background:var(--sur)}
.vrow.oped{border-color:var(--blue);box-shadow:0 0 0 2px rgba(29,78,216,.1)}
.vtop{display:flex;align-items:center;gap:8px;padding:5px 8px;flex-wrap:wrap}
.dbox{flex-shrink:0;text-align:center;width:42px}
.dds{font-size:8px;font-weight:700;padding:2px;border-radius:3px 3px 0 0;text-transform:uppercase;letter-spacing:.5px}
.dnum{font-size:17px;font-weight:700;line-height:1;padding:2px}
.dhora{font-size:9px;color:var(--tx3);margin-top:2px;font-weight:600}
.vtags{flex:1;display:flex;flex-wrap:wrap;gap:3px;min-width:0}
.vtag{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.vbtn{padding:4px 10px;border-radius:6px;border:1px solid var(--brd);background:none;font-size:11px;color:var(--tx2);white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:3px;font-weight:500}
.vbtn:hover{background:var(--sur2)}
.vbtn.on{background:var(--cyan-b);color:var(--cyan);border-color:transparent;font-weight:700}
.fer-tag{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--err-b);color:var(--err);border:1px solid var(--err-br);font-weight:700}
.pb-tag{display:inline-flex;align-items:center;gap:2px;font-size:10px;padding:2px 8px;border-radius:20px;background:var(--ok-b);color:var(--ok);border:1px solid var(--ok-br);font-weight:700}

/* ── EDIT PANEL ── */
.epanel{border-top:1px solid var(--brd);padding:8px 10px 10px 58px;background:var(--sur2);display:none}
.epanel.open{display:block}
.egrid{display:grid;grid-template-columns:1fr 1fr 72px;gap:6px;margin-bottom:8px}
.ef label{font-size:9px;color:var(--tx3);display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.ef input,.ef textarea{width:100%}
.ef textarea{height:34px}
.pbox{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);padding:8px 10px;margin-bottom:6px}
.plbl{font-size:10px;font-weight:700;color:var(--tx2);margin-bottom:6px;display:flex;align-items:center;gap:4px;text-transform:uppercase;letter-spacing:.5px}
.ptags{display:flex;flex-wrap:wrap;gap:3px}
.ptag{font-size:10px;padding:3px 9px;border-radius:20px;cursor:pointer;border:1px solid var(--brd);color:var(--tx2);background:var(--sur2);display:inline-flex;align-items:center;gap:2px;user-select:none;transition:all .12s}
.ptag:hover{border-color:var(--brd2);background:var(--sur3)}
.ptag.s{background:var(--ok-b);color:var(--ok);border-color:var(--ok-br);font-weight:700}
.gadd{display:flex;gap:5px;margin-top:6px;align-items:center}
.gadd select{flex:1;font-size:11px}
.eact{display:flex;gap:5px;justify-content:flex-end;margin-top:6px}
.btn-save-v{padding:5px 14px;border-radius:7px;border:none;background:var(--ok);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.btn-save-v:hover{opacity:.9}

/* ── RELATÓRIO ── */
.rel-tabs{display:flex;gap:4px;margin-bottom:12px}
.rtab{padding:7px 16px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
.rtab-m{background:var(--purple-b);color:var(--purple)}
.rtab-m.on{background:var(--purple);color:#fff}
.rtab-s{background:var(--cyan-b);color:var(--cyan)}
.rtab-s.on{background:var(--cyan);color:#fff}
.rtab-h{background:var(--amber-b);color:var(--amber)}
.rtab-h.on{background:var(--amber);color:#fff}
.rblock{background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);padding:1rem;box-shadow:var(--sh);margin-bottom:10px}
.rblock h3{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:.75rem;display:flex;align-items:center;gap:6px}
.rt{width:100%;border-collapse:collapse;font-size:11px}
.rt th{font-size:10px;color:var(--tx3);font-weight:600;text-align:left;padding:5px 8px;border-bottom:1px solid var(--brd);background:var(--sur2)}
.rt td{padding:5px 8px;border-bottom:1px solid var(--brd);color:var(--tx);vertical-align:top}
.rt tr:last-child td{border-bottom:none}
.rt tr:hover td{background:var(--sur2)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:5px}
.pcard{background:var(--sur2);border-radius:var(--r);padding:.5rem .75rem;display:flex;align-items:center;gap:8px}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.av-n{font-size:11px;font-weight:600;color:var(--tx)}
.av-s{font-size:10px;color:var(--tx3)}
/* Semanas */
.sem-btn{padding:5px 11px;border-radius:7px;border:1px solid var(--brd);background:var(--sur);color:var(--tx2);font-size:11px;font-weight:500;cursor:pointer;transition:all .12s}
.sem-btn:hover{border-color:var(--brd2)}
.sem-btn.on{background:var(--cyan);border-color:var(--cyan);color:#fff;font-weight:700}
.sem-strip{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.ds-block{margin-bottom:10px}
.ds-header{padding:8px 12px;border-radius:8px 8px 0 0;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.ds-body{border:1px solid var(--brd);border-top:none;border-radius:0 0 8px 8px;overflow:hidden;background:var(--sur)}
/* Histórico */
.hist-card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);padding:1rem;margin-bottom:8px;box-shadow:var(--sh)}
.hist-card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--brd);flex-wrap:wrap;gap:8px}
.hist-mes{font-size:15px;font-weight:700;color:var(--tx)}
.hist-stats{display:flex;gap:12px}
.hs{text-align:center}
.hs-n{font-size:18px;font-weight:700;line-height:1}
.hs-l{font-size:9px;color:var(--tx3)}

/* ── SIGN ── */
.signrow{display:flex;justify-content:space-between;align-items:center;padding:.625rem 1rem;background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);font-size:11px;color:var(--tx3);margin-top:1rem;flex-wrap:wrap;gap:6px;box-shadow:var(--sh)}
.sname{font-size:13px;font-weight:700;color:var(--tx)}
.srole{font-size:10px;color:var(--tx3)}

/* ── GESTÃO COLABS ── */
.setor-tabs{display:flex;gap:0;border-bottom:2px solid var(--brd);margin-bottom:12px;overflow-x:auto}
.stab{padding:8px 16px;border:none;border-bottom:3px solid transparent;background:none;font-size:12px;font-weight:600;color:var(--tx2);cursor:pointer;white-space:nowrap;margin-bottom:-2px;display:flex;align-items:center;gap:5px;transition:all .15s}
.stab:hover{color:var(--tx)}
.stab-1.on{color:#1d4ed8;border-bottom-color:#1d4ed8}
.stab-2.on{color:#166534;border-bottom-color:#166534}
.stab-3.on{color:#6b21a8;border-bottom-color:#6b21a8}
.stab-4.on{color:#92400e;border-bottom-color:#92400e}
.gc-panel{background:var(--sur);border:1px solid var(--brd);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
.gc-hdr{padding:.75rem 1rem;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gc-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.gc-title{font-size:14px;font-weight:700}
.gc-sub{font-size:10px;color:var(--tx3);margin-top:1px}
.gc-add{display:flex;gap:6px;padding:.625rem 1rem;border-bottom:1px solid var(--brd);background:var(--sur2);align-items:center;flex-wrap:wrap}
.gc-add input{flex:2;min-width:160px}
.gc-add select{flex:1.5;min-width:130px;font-size:11px}
.gc-search-bar{display:flex;gap:6px;padding:.5rem 1rem;border-bottom:1px solid var(--brd);align-items:center}
.gc-search-bar input{flex:1}
.ctable{width:100%}
.ctable thead tr{background:var(--sur2)}
.ctable th{font-size:10px;font-weight:600;color:var(--tx3);text-align:left;padding:6px 10px;border-bottom:1px solid var(--brd);text-transform:uppercase;letter-spacing:.4px}
.ctable td{padding:6px 10px;border-bottom:1px solid var(--brd);font-size:12px;vertical-align:middle}
.ctable tr:last-child td{border-bottom:none}
.ctable tr:hover td{background:var(--sur2)}
.cv-txt{font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-inp{font-size:12px;flex:1;display:none}
.cv-inp.ed{display:block}
.cv-txt.ed{display:none}
.cav{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.cacts{display:flex;gap:3px;justify-content:flex-end}
.ca{width:26px;height:26px;border-radius:6px;border:1px solid var(--brd);background:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--tx3);cursor:pointer;transition:all .12s}
.ca:hover{background:var(--sur2)}
.ca.del:hover{background:var(--err-b);color:var(--err);border-color:var(--err-br)}
.ca.sv:hover{background:var(--ok-b);color:var(--ok);border-color:var(--ok-br)}
.ca.ed-a:hover{background:var(--cyan-b);color:var(--cyan);border-color:transparent}
.gc-ft{padding:.5rem 1rem;border-top:1px solid var(--brd);background:var(--sur2);font-size:11px;color:var(--tx3);display:flex;justify-content:space-between}
.gc-empty{padding:2rem;text-align:center;color:var(--tx3);font-size:12px}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:600;padding:16px}
.modal-box{background:var(--sur);border-radius:var(--rxl);padding:1.25rem;max-width:500px;width:100%;border:1px solid var(--brd);box-shadow:0 24px 60px rgba(0,0,0,.3);max-height:88vh;overflow-y:auto}
/* PDF / PRINT ESPECÍFICO */
.pdf-btn-m{background:#7c3aed;color:#fff;border:none;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.pdf-btn-m:hover{opacity:.9}

function toast(msg,tipo="ok"){
  const t=document.getElementById("toast");
  t.textContent=msg; t.className="toast show "+tipo;
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2600);
}

function navMes(d){
  // Salvar mês atual automaticamente antes de mudar
  autoSalvar();
  CUR_MES+=d;
  if(CUR_MES<0){CUR_MES=11;CUR_ANO--;}
  if(CUR_MES>11){CUR_MES=0;CUR_ANO++;}
  // Carregar dados do mês (histórico ou nova escala limpa)
  const k=mesKey();
  if(HIST[k]){
    D=JSON.parse(JSON.stringify(HIST[k]));
    toast("Mês carregado: "+mesLabel(),"info");
  } else {
    // Novo mês: copia colaboradores mas limpa visitas/presenças
    D=JSON.parse(JSON.stringify(DADOS_BASE)).map(inst=>({
      ...inst,
      v:inst.v.map(v=>({...v,pr:[],np:""}))
    }));
    toast("Nova escala criada para "+mesLabel(),"info");
  }
  OI={}; EM={};
  atualizarUI();
}

}

  RELV=t;

}

    ["ti-building","kpi-i","Instituições",tI(),"ativas","#6b21a8"],
  ].map(([ic,cls,l,n,s,c])=>`
    <div class="kpi ${cls}">
      <div class="kpi-l"><i class="ti ${ic}" style="font-size:13px;color:${c}"></i>${l}</div>
      <div class="kpi-n" style="color:${c}">${n}</div>

// ── ESCALA ──
function renderEscala(){
  // Setor strip colorido
  document.getElementById("sstrip").innerHTML=
    `<button class="spill spill-all${SF===null?" on":""}" onclick="setSF(null)"><i class="ti ti-refresh" style="font-size:12px"></i> Todos</button>`
    +[1,2,3,4].map(s=>{
      const I=SI[s];
      const cnt=D.filter(i=>i.s===s).reduce((a,i)=>a+gv(i.v).length,0);
      return`<button class="spill spill-${s}${SF===s?" on":""}" onclick="setSF(${s})">
        ${I.ico} Setor ${s}
        <span style="font-size:10px;opacity:.75">${cnt}</span>
      </button>`;
    }).join("");

  const filt=SF===null?D:D.filter(i=>i.s===SF);
  document.getElementById("ilist").innerHTML=filt.map(buildIC).join("")||
    `<div style="padding:2rem;text-align:center;color:var(--tx3)">Nenhuma instituição encontrada.</div>`;
}

function setSF(s){SF=s;renderEscala();}

function buildIC(inst){
  const I=SI[inst.s]||{cor:"#64748b",bg:"#f1f5f9",ico:"📌"};
  const open=OI[inst.id];
  const rv=gv(inst.v).length;
  const pr=inst.v.reduce((a,v)=>a+(v.pr||[]).length,0);
  const pt=inst.v.reduce((a,v)=>{const n=parseInt(v.np);return a+(isNaN(n)?0:n)},0);

  const ctags=inst.p.length
    ?inst.p.map(p=>`<span class="ct" style="background:${I.bg};color:${I.cor}">${esc(p)}</span>`).join("")
    :`<span style="font-size:10px;color:var(--tx3);font-style:italic">—</span>`;

  return`<div class="ic ic-s${inst.s}" id="ic${inst.id}">
    <button class="ic-hd" onclick="togI('${inst.id}')">
      <div class="ic-ico" style="background:${I.bg}">${I.ico}</div>
      <div class="ic-info">
        <div class="ic-name ic-name-s${inst.s}">${esc(inst.nome)}</div>
        <div class="ic-sub">Setor ${inst.s} · Coord: ${esc(inst.coord)} · ${esc(inst.periodo||"")}</div>
      </div>
      <div class="ic-meta">
        <div><div class="mn" style="color:${I.cor}">${rv}</div><div class="ml">vis.</div></div>
        <div><div class="mn" style="color:${I.cor}">${pr}</div><div class="ml">pres.</div></div>
        ${pt?`<div><div class="mn" style="color:var(--amber)">${pt}</div><div class="ml">atend.</div></div>`:""}
      </div>
      <i class="ti ti-chevron-right chev${open?" open":""}"></i>
    </button>
    <div class="ic-body${open?" open":""}" id="ib${inst.id}">
      <div class="crow">
        <div class="ctags">${ctags}</div>
        <button class="btn-xs" onclick="editColabs('${inst.id}')"><i class="ti ti-edit"></i> Editar colaboradores</button>
      </div>
      <div class="vlist">${inst.v.map(v=>buildVR(inst,v,I)).join("")}</div>
    </div>
  </div>`;
}

function buildVR(inst,v,I){
  const fer=v.at==="FERIADO";
  const k=inst.id+"_"+v.id;
  const ed=EM[k];
  const pr=v.pr||[];
  const cD=DC[v.ds]||"#475569",bD=DB[v.ds]||"#f1f5f9";
  const sugs=[...new Set([v.at,v.mu,...inst.p,...(v.im||"").split("/").map(s=>s.trim()),...(v.pf||"").split("/").map(s=>s.trim())].filter(s=>s&&s.length>1&&!["FERIADO","CONVIDAR IRMANDADE","A CONFIRMAR","—",""].includes(s)))].sort();

  const tags=fer?`<span class="fer-tag"><i class="ti ti-alert-circle" style="font-size:11px"></i> Feriado</span>`:[
    v.at?`<span class="vtag" style="background:var(--sur2);color:var(--tx);border:1px solid var(--brd)"><b>Atend:</b> ${esc(v.at)}</span>`:"",
    v.mu?`<span class="vtag" style="background:var(--purple-b);color:var(--purple)">🎵 ${esc(v.mu)}</span>`:"",
    v.im?`<span class="vtag" style="background:var(--blue-b);color:var(--blue)" title="${esc(v.im)}">♂ ${esc(v.im.length>22?v.im.slice(0,20)+"…":v.im)}</span>`:"",
    v.pf?`<span class="vtag" style="background:#fdf2f8;color:#9d174d" title="${esc(v.pf)}">♀ ${esc(v.pf.length>22?v.pf.slice(0,20)+"…":v.pf)}</span>`:"",
    v.np?`<span class="vtag" style="background:var(--amber-b);color:var(--amber)">👥 ${esc(v.np)} atend.</span>`:"",
    pr.length?`<span class="pb-tag"><i class="ti ti-check" style="font-size:11px"></i> ${pr.length} presentes</span>`:"",
  ].filter(Boolean).join("");

  const ptags=sugs.map(p=>{
    const sel=pr.includes(p);
    return`<span class="ptag${sel?" s":""}" onclick="togP('${inst.id}','${v.id}','${p.replace(/'/g,"\\'")}','${k}')">${sel?'<i class="ti ti-check" style="font-size:10px"></i>':''} ${esc(p)}</span>`;
  }).join("");

  const ep=`<div class="epanel${ed?" open":""}" id="ep${k}">
    <div class="egrid">
      <div class="ef"><label>Atendente</label><input value="${esc(v.at||"")}" onchange="patch('${inst.id}','${v.id}','at',this.value)" list="dl${inst.id}"/></div>
      <div class="ef"><label>Músico / Organista</label><input value="${esc(v.mu||"")}" onchange="patch('${inst.id}','${v.id}','mu',this.value)" list="dl${inst.id}"/></div>
      <div class="ef"><label>Nº Atendidos</label><input type="number" min="0" style="width:100%" value="${esc(v.np||"")}" onchange="patch('${inst.id}','${v.id}','np',this.value)"/></div>
      <div class="ef" style="grid-column:span 2"><label>Colaboradores ♂ (separar por /)</label><textarea onchange="patch('${inst.id}','${v.id}','im',this.value)">${esc(v.im||"")}</textarea></div>
      <div class="ef"><label>Colaboradoras ♀</label><textarea onchange="patch('${inst.id}','${v.id}','pf',this.value)">${esc(v.pf||"")}</textarea></div>
    </div>
    <datalist id="dl${inst.id}">${inst.p.map(p=>`<option value="${esc(p)}"/>`).join("")}</datalist>
    <div class="pbox">
      <div class="plbl"><i class="ti ti-checkbox" style="font-size:13px;color:var(--ok)"></i> Quem participou desta visita</div>
      <div class="ptags" id="pt${k}">${ptags}</div>
      <div class="gadd">
        <select id="gl${k}"><option value="">+ Adicionar da lista global...</option>${CL.filter(c=>!sugs.includes(c)).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select>
        <button class="btn-xs" onclick="addG('${inst.id}','${v.id}','${k}')"><i class="ti ti-plus" style="font-size:12px"></i> Add</button>
      </div>
    </div>
    <div class="eact">
      <button class="btn-save-v" onclick="togE('${k}')"><i class="ti ti-check"></i> Salvar</button>
      <button class="btn-xs" onclick="togE('${k}')">Fechar</button>
    </div>
  </div>`;

  return`<div class="vrow${ed?" oped":""}" id="vr${k}">
    <div class="vtop">
      <div class="dbox">
        <div class="dds" style="background:${bD};color:${cD}">${DA[v.ds]||"—"}</div>
        <div class="dnum" style="background:${bD};color:${cD}">${pad(v.dia)}</div>
        <div class="dhora">${v.h}</div>
      </div>
      <div class="vtags">${tags}</div>
      ${!fer?`<button class="vbtn${ed?" on":""}" onclick="togE('${k}')"><i class="ti ti-${ed?"x":"edit"}" style="font-size:12px"></i>${ed?" Fechar":" Editar"}</button>`:""}
    </div>
    ${!fer?ep:""}
  </div>`;
}

// ── ACTIONS ──
function togI(id){
  OI[id]=!OI[id];
  document.getElementById("ib"+id)?.classList.toggle("open",!!OI[id]);
  document.querySelector("#ic"+id+" .chev")?.classList.toggle("open",!!OI[id]);
}
function togE(k){
  EM[k]=!EM[k];
  const ep=document.getElementById("ep"+k),btn=document.querySelector("#vr"+k+" .vbtn");
  ep?.classList.toggle("open",!!EM[k]);
  document.getElementById("vr"+k)?.classList.toggle("oped",!!EM[k]);
  if(btn){btn.classList.toggle("on",!!EM[k]);btn.innerHTML=`<i class="ti ti-${EM[k]?"x":"edit"}" style="font-size:12px"></i>${EM[k]?" Fechar":" Editar"}`;}
}
function patch(iid,vid,f,val){
  const i=D.find(x=>x.id===iid),v=i?.v.find(x=>x.id===vid);
  if(v){v[f]=val;renderKPIs();}
}
function togP(iid,vid,nome,k){
  const i=D.find(x=>x.id===iid),v=i?.v.find(x=>x.id===vid);
  if(!v) return;
  if(!v.pr) v.pr=[];
  const idx=v.pr.indexOf(nome);
  if(idx>=0) v.pr.splice(idx,1); else v.pr.push(nome);
  const box=document.getElementById("pt"+k);
  box?.querySelectorAll(".ptag").forEach(el=>{
    const n=el.textContent.replace(/\s/g,"").replace("✓","");
    if(n===nome.replace(/\s/g,"")){
      el.classList.toggle("s",v.pr.includes(nome));
      el.innerHTML=(v.pr.includes(nome)?'<i class="ti ti-check" style="font-size:10px"></i> ':'')+esc(nome);
    }
  });
  const vrow=document.getElementById("vr"+k);
  if(vrow){
    let pb=vrow.querySelector(".pb-tag");
    if(v.pr.length>0){
      if(!pb){pb=document.createElement("span");pb.className="pb-tag";vrow.querySelector(".vtags")?.appendChild(pb);}
      pb.innerHTML=`<i class="ti ti-check" style="font-size:11px"></i> ${v.pr.length} presentes`;
    } else if(pb) pb.remove();
  }
  renderKPIs();
}
function addG(iid,vid,k){
  const sel=document.getElementById("gl"+k),nome=sel?.value;
  if(!nome) return;
  const i=D.find(x=>x.id===iid),v=i?.v.find(x=>x.id===vid);
  if(!v){return;} if(!v.pr) v.pr=[]; if(!v.pr.includes(nome)) v.pr.push(nome);
  const box=document.getElementById("pt"+k);
  if(box){const sp=document.createElement("span");sp.className="ptag s";sp.innerHTML=`<i class="ti ti-check" style="font-size:10px"></i> ${esc(nome)}`;sp.onclick=()=>togP(iid,vid,nome,k);box.appendChild(sp);}
  sel.value=""; renderKPIs();
}

// ── EDIT COLABS MODAL ──
function editColabs(iid){
  const inst=D.find(i=>i.id===iid);if(!inst) return;
  const I=SI[inst.s]||{cor:"#1d4ed8",bg:"#dbeafe"};
  const all=[...new Set([...CL,...inst.p])].sort();
  let sel=[...inst.p];
  function rr(){
    const q=(document.getElementById("mc-busca")?.value||"").toLowerCase();
    const flt=q?all.filter(p=>p.toLowerCase().includes(q)):all;
    document.getElementById("mc-sel").innerHTML=sel.length
      ?sel.map(p=>`<span onclick="mcT('${p.replace(/'/g,"\\'")}',1)" style="font-size:10px;padding:2px 9px;border-radius:20px;background:${I.bg};color:${I.cor};cursor:pointer;font-weight:600;border:1px solid ${I.cor}40">${esc(p)} ✕</span>`).join("")
      :`<span style="font-size:10px;color:var(--tx3);font-style:italic">Nenhum selecionado</span>`;
    document.getElementById("mc-cnt").textContent=sel.length+" sel.";
    document.getElementById("mc-grid").innerHTML=flt.map(p=>{const s=sel.includes(p);return`<button onclick="mcT('${p.replace(/'/g,"\\'")}',0)" style="padding:4px 5px;border-radius:6px;border:1px solid ${s?I.cor:"var(--brd)"};background:${s?I.bg:"var(--sur)"};color:${s?I.cor:"var(--tx2)"};font-size:10px;cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .1s">${s?"✓ ":""}${esc(p)}</button>`}).join("");
  }
  window.mcT=(p,rm)=>{const i=sel.indexOf(p);if(rm&&i>=0)sel.splice(i,1);else if(!rm){if(i>=0)sel.splice(i,1);else{sel.push(p);sel.sort();}}rr();};
  window.mcSave=()=>{inst.p=[...sel];document.getElementById("modal-root").innerHTML="";renderEscala();toast("Colaboradores salvos","ok");};
  window.mcClose=()=>document.getElementById("modal-root").innerHTML="";
  document.getElementById("modal-root").innerHTML=`
  <div class="modal-bg" onclick="if(event.target===this)mcClose()">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div>
          <div style="font-size:10px;font-weight:700;color:${I.cor}">${I.ico} ${esc(inst.nome)}</div>
          <div style="font-size:14px;font-weight:700;color:var(--tx);margin-top:2px">Editar Colaboradores</div>
        </div>
        <button class="btn-xs" onclick="mcClose()"><i class="ti ti-x"></i></button>
      </div>
      <div id="mc-sel" style="display:flex;flex-wrap:wrap;gap:3px;min-height:28px;background:var(--sur2);border-radius:var(--r);padding:6px 8px;margin-bottom:8px;border:1px solid var(--brd)"></div>
      <input id="mc-busca" placeholder="🔍 Buscar..." style="width:100%;margin-bottom:6px" oninput="rr()"/>
      <div id="mc-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px;max-height:200px;overflow-y:auto"></div>
      <div style="display:flex;gap:5px;justify-content:flex-end;margin-top:10px;align-items:center">
        <span id="mc-cnt" style="font-size:11px;color:var(--tx3);margin-right:auto"></span>
        <button class="btn-xs" onclick="sel=[];rr()">🗑 Limpar</button>
        <button class="btn-xs" onclick="mcClose()">Cancelar</button>
        <button class="btn-save-v" onclick="mcSave()"><i class="ti ti-check"></i> Salvar</button>
      </div>
    </div>
  </div>`;
  rr();
}

// ── GESTÃO DE COLABORADORES ──
function renderGC(){
  document.getElementById("setor-tabs").innerHTML=[1,2,3,4].map(s=>{
    const I=SI[s];
    const total=D.filter(i=>i.s===s).reduce((a,i)=>a+i.p.length,0);
    return`<button class="stab stab-${s}${GCS===s?" on":""}" onclick="gcSS(${s})">${I.ico} Setor ${s} <span style="opacity:.6">(${total})</span></button>`;
  }).join("");
  renderGCP();
}
function gcSS(s){GCS=s;GCB="";renderGC();}
function renderGCP(){
  const I=SI[GCS]||{cor:"#64748b",bg:"#f1f5f9",ico:"📌",n:"—"};
  const ins=D.filter(i=>i.s===GCS);
  const cMap={};
  ins.forEach(inst=>inst.p.forEach(p=>{if(!cMap[p])cMap[p]=[];if(!cMap[p].includes(inst.id))cMap[p].push(inst.id);}));
  const todos=Object.keys(cMap).sort();
  const filt=GCB?todos.filter(p=>p.toLowerCase().includes(GCB.toLowerCase())):todos;
  const totalPres=ins.reduce((a,i)=>a+i.v.reduce((b,v)=>b+(v.pr||[]).length,0),0);
  const instOpts=ins.map(i=>`<option value="${i.id}">${esc(i.nome)}</option>`).join("");

  const rows=filt.length===0
    ?`<div class="gc-empty"><i class="ti ti-user-off" style="font-size:28px;display:block;margin:0 auto 8px;opacity:.3"></i>${GCB?"Nenhum resultado":"Nenhum colaborador cadastrado"}</div>`
    :filt.map((p,idx)=>{
      const instNames=cMap[p].map(id=>D.find(i=>i.id===id)?.nome||"").filter(Boolean);
      const ini=p.split(" ").slice(0,2).map(w=>w[0]).join("");
      const freq=ins.reduce((a,i)=>a+i.v.reduce((b,v)=>b+(v.pr||[]).includes(p)?1:0,0),0);
      const pk=p.replace(/\s/g,"_").replace(/[^a-zA-Z0-9_]/g,"X");
      return`<tr id="cr-${pk}">
        <td style="color:var(--tx3);font-size:10px;font-weight:600;width:32px">${idx+1}</td>
        <td>
          <div style="display:flex;align-items:center;gap:7px">
            <div class="cav" style="background:${I.bg};color:${I.cor}">${ini}</div>
            <span class="cv-txt" id="ct-${pk}">${esc(p)}</span>
            <input class="cv-inp" id="ci-${pk}" value="${esc(p)}" onkeydown="if(event.key==='Enter')svC('${esc(p).replace(/'/g,"\\'")}','${pk}');if(event.key==='Escape')cxC('${pk}','${esc(p).replace(/'/g,"\\'")}')"/>
          </div>
        </td>
        <td style="font-size:10px">${instNames.map(n=>`<span style="font-size:9px;background:${I.bg};color:${I.cor};padding:1px 6px;border-radius:20px;margin:1px;display:inline-block">${esc(n)}</span>`).join("")}</td>
        <td style="text-align:center">${freq>0?`<span style="font-size:11px;font-weight:700;color:var(--ok)">${freq}×</span>`:`<span style="font-size:11px;color:var(--tx3)">—</span>`}</td>
        <td>
          <div class="cacts">
            <button class="ca ed-a" id="eb-${pk}" title="Editar" onclick="stEC('${pk}')"><i class="ti ti-pencil"></i></button>
            <button class="ca sv" id="sb-${pk}" style="display:none" title="Salvar" onclick="svC('${esc(p).replace(/'/g,"\\'")}','${pk}')"><i class="ti ti-check"></i></button>
            <button class="ca" id="xb-${pk}" style="display:none" title="Cancelar" onclick="cxC('${pk}','${esc(p).replace(/'/g,"\\'")}')"><i class="ti ti-x"></i></button>
            <button class="ca del" title="Excluir" onclick="cDel('${esc(p).replace(/'/g,"\\'")}')"><i class="ti ti-trash"></i></button>
          </div>
        </td>
      </tr>`;
    }).join("");

  document.getElementById("gc-panel-wrap").innerHTML=`
  <div class="gc-panel">
    <div class="gc-hdr">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="gc-ico" style="background:${I.bg}">${I.ico}</div>
        <div><div class="gc-title" style="color:${I.cor}">Setor ${GCS} — ${I.n}</div><div class="gc-sub">${ins.length} inst. · ${todos.length} colaboradores · ${totalPres} presenças</div></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span style="font-size:11px;padding:4px 10px;border-radius:20px;background:${I.bg};color:${I.cor};font-weight:600;border:1px solid ${I.cor}30">${todos.length} colabs.</span>
        <span style="font-size:11px;padding:4px 10px;border-radius:20px;background:var(--ok-b);color:var(--ok);font-weight:600;border:1px solid var(--ok-br)">${totalPres} pres.</span>
      </div>
    </div>
    <div class="gc-add">
      <i class="ti ti-user-plus" style="font-size:16px;color:${I.cor};flex-shrink:0"></i>
      <input id="gc-name" placeholder="Nome completo do novo colaborador..." onkeydown="if(event.key==='Enter')gcAdd()"/>
      <select id="gc-inst"><option value="">Selecionar instituição...</option>${instOpts}</select>
      <button class="btn-save-v" onclick="gcAdd()"><i class="ti ti-plus"></i> Cadastrar</button>
    </div>
    <div class="gc-search-bar">
      <i class="ti ti-search" style="font-size:14px;color:var(--tx3)"></i>
      <input value="${esc(GCB)}" placeholder="Buscar colaborador..." oninput="GCB=this.value;renderGCP()"/>
    </div>
    <div style="overflow-x:auto">
      <table class="ctable">
        <thead><tr>
          <th style="width:32px">#</th><th>Nome</th><th>Instituições</th>
          <th style="text-align:center;width:55px">Pres.</th>
          <th style="width:90px;text-align:right">Ações</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="gc-ft"><span>${filt.length} de ${todos.length} colaborador${todos.length!==1?"es":""}</span><span>Setor ${GCS} · ${mesLabel()}</span></div>
  </div>`;
}

function gcAdd(){
  const nEl=document.getElementById("gc-name"),iEl=document.getElementById("gc-inst");
  const nome=(nEl?.value||"").trim().toUpperCase(),iid=iEl?.value;
  if(!nome){toast("Digite o nome","err");nEl?.focus();return;}
  if(!iid){toast("Selecione a instituição","err");iEl?.focus();return;}
  const inst=D.find(i=>i.id===iid);if(!inst) return;
  if(inst.p.includes(nome)){toast(nome+" já está nesta inst.","err");return;}
  inst.p.push(nome);inst.p.sort();
  if(!CL.includes(nome)){CL.push(nome);CL.sort();}
  nEl.value="";iEl.value="";
  renderGCP();renderEscala();
  toast(nome+" cadastrado!","ok");
}
function stEC(pk){
  document.getElementById("ct-"+pk)?.classList.add("ed");
  document.getElementById("ci-"+pk)?.classList.add("ed");
  document.getElementById("eb-"+pk) && (document.getElementById("eb-"+pk).style.display="none");
  document.getElementById("sb-"+pk) && (document.getElementById("sb-"+pk).style.display="flex");
  document.getElementById("xb-"+pk) && (document.getElementById("xb-"+pk).style.display="flex");
  document.getElementById("ci-"+pk)?.focus();document.getElementById("ci-"+pk)?.select();
}
function cxC(pk,orig){
  document.getElementById("ct-"+pk)?.classList.remove("ed");
  document.getElementById("ci-"+pk)?.classList.remove("ed");
  if(document.getElementById("ci-"+pk)) document.getElementById("ci-"+pk).value=orig;
  document.getElementById("eb-"+pk) && (document.getElementById("eb-"+pk).style.display="flex");
  document.getElementById("sb-"+pk) && (document.getElementById("sb-"+pk).style.display="none");
  document.getElementById("xb-"+pk) && (document.getElementById("xb-"+pk).style.display="none");
}
function svC(nomeAnt,pk){
  const novoNome=(document.getElementById("ci-"+pk)?.value||"").trim().toUpperCase();
  if(!novoNome){toast("Nome vazio","err");return;}
  if(novoNome===nomeAnt){cxC(pk,nomeAnt);return;}
  D.forEach(inst=>{
    const i=inst.p.indexOf(nomeAnt);if(i>=0)inst.p[i]=novoNome;
    inst.v.forEach(v=>{if(!v.pr)return;const pi=v.pr.indexOf(nomeAnt);if(pi>=0)v.pr[pi]=novoNome;});
  });
  const gi=CL.indexOf(nomeAnt);
  if(gi>=0)CL[gi]=novoNome; else CL.push(novoNome);
  CL.sort();
  renderGCP();renderEscala();toast("Atualizado: "+novoNome,"ok");
}
function cDel(nome){
  const freq=D.reduce((a,i)=>a+i.v.reduce((b,v)=>b+(v.pr||[]).includes(nome)?1:0,0),0);
  const msg=`Excluir "${nome}"?${freq>0?`\n${freq} presença(s) também serão removidas.`:""}`;
  if(!confirm(msg)) return;
  let rm=0;
  D.forEach(inst=>{
    const i=inst.p.indexOf(nome);if(i>=0){inst.p.splice(i,1);rm++;}
    inst.v.forEach(v=>{if(!v.pr)return;const pi=v.pr.indexOf(nome);if(pi>=0)v.pr.splice(pi,1);});
  });
  renderGCP();renderEscala();renderKPIs();toast(nome+" removido ("+rm+" inst.)","ok");
}

    <span>${new Date().toLocaleDateString("pt-BR")}</span>
  </div>
  </body></html>`);
  w.document.close();
  setTimeout(()=>w.print(),400);
}

// ── EMAIL ──
function buildEmailBody(){
  const tr=tR(),tp=tPr(),tpt=tPt();
  let b=`DARPE — ${mesLabel()}\nResponsável: ${SIGN}\nData: ${new Date().toLocaleDateString("pt-BR")}\n\nRESUMO\nReuniões: ${tr} | Presenças: ${tp} | Atendidos: ${tpt} | Inst. ativas: ${tI()}\n\n`;
  [1,2,3,4].forEach(s=>{
    const I=SI[s];const ins=D.filter(i=>i.s===s);
    const rv=ins.reduce((a,i)=>a+gv(i.v).length,0);if(!rv) return;
    const pv=ins.reduce((a,i)=>a+i.v.reduce((b,v)=>b+(v.pr||[]).length,0),0);
    const at=ins.reduce((a,i)=>a+i.v.reduce((b,v)=>{const n=parseInt(v.np);return a+(isNaN(n)?0:n)},0),0);
    b+=`SETOR ${s} — ${I.n}\nReuniões: ${rv} | Presenças: ${pv} | Atendidos: ${at}\n`;
    ins.forEach(i=>{
      const rv2=gv(i.v).length;if(!rv2) return;
      b+=`  • ${i.nome} (${rv2} vis.)\n`;
      i.v.filter(v=>v.at!=="FERIADO").forEach(v=>{
        b+=`    ${pad(v.dia)}/jun ${v.h} — ${v.at}`;
        if(v.mu) b+=` | 🎵${v.mu}`;
        if(v.np) b+=` | ${v.np} atendidos`;
        if(v.pr?.length) b+=` | Pres: ${v.pr.join(", ")}`;
        b+="\n";
      });
    });
    b+="\n";
  });
  b+=`___\n${SIGN}\n${EMAIL}`;
  return b;
}
function enviarEmail(){
  const s=encodeURIComponent(`DARPE — Relatório ${mesLabel()}`);
  const b=encodeURIComponent(buildEmailBody());
  window.open(`mailto:${EMAIL}?subject=${s}&body=${b}`,"_blank");
  toast("Abrindo e-mail...","info");
}
